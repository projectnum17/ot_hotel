<div class="slider-arrows">
    <button type="button" class="slider-arrows__arrow{{#if prevBtn}} {{prevBtn}}{{/if}}">
        <svg>
            <use xlink:href="./assets/images/icons/svg/sprite.svg#sliderArrow"></use>
        </svg>
    </button>
    <button type="button" class="slider-arrows__arrow{{#if nextBtn}} {{nextBtn}}{{/if}}">
        <svg>
            <use xlink:href="./assets/images/icons/svg/sprite.svg#sliderArrow"></use>
        </svg>
    </button>
</div>
