<button
    type="{{#if type}}{{type}}{{else}}button{{/if}}"
    {{#if className}}class="{{className}}"{{/if}}
>
    {{#if icon}}
        <img src="{{icon}}" alt="{{iconAlt}}">
    {{/if}}
    {{#if label}}
        {{#if tagWrapper}}
            <{{tagWrapper}}>{{ label }}</{{tagWrapper}}>
        {{else}}
            {{label}}
        {{/if}}
    {{/if}}
</button>
